<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light" />
  <title>معاينة المعدة ثلاثية الأبعاد | FASTER B</title>
  <link rel="stylesheet" href="./style.css?v=6" />
  <link rel="preload" href="./products.json" as="fetch" crossorigin="anonymous" />
  <script type="module">
    try {
      await import('./vendor/model-viewer.min.js');
    } catch (e) {
      await import('https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js');
    }
  </script>
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="btn primary" type="button">الرجوع إلى عرض السعر</button>
    <h1 id="productName" class="product-name">معاينة المعدة ثلاثية الأبعاد</h1>
  </header>

  <main id="stage" class="stage">
    <model-viewer id="viewer"
      camera-controls
      touch-action="pan-y"
      tone-mapping="neutral"
      shadow-intensity="0.45"
      shadow-softness="0.9"
      exposure="0.82"
      environment-image="neutral"
      loading="eager"
      reveal="auto"
      alt="معاينة ثلاثية الأبعاد للمعدة">
      <div slot="progress-bar" class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    </model-viewer>

    <div id="loading" class="overlay-card">
      <div class="spinner"></div>
      <strong id="loadingTitle">جاري تحميل النموذج ثلاثي الأبعاد…</strong>
      <span id="loadingText">يرجى الانتظار</span>
    </div>

    <div id="fallback" class="fallback hidden">
      <img id="fallbackImg" alt="صورة المعدة" />
      <div class="fallback-box">
        <strong>تعذر تحميل النموذج ثلاثي الأبعاد لهذه المعدة.</strong>
        <span>هذه صورة المنتج وليست معاينة ثلاثية الأبعاد.</span>
      </div>
    </div>
  </main>

  <nav class="actionbar" aria-label="أدوات المعاينة">
    <button id="resetBtn" class="btn" type="button">إعادة الضبط</button>
    <button id="fitBtn" class="btn" type="button">إظهار كامل المعدة</button>
  </nav>
  <script type="module" src="./viewer.js?v=6"></script>
</body>
</html>
