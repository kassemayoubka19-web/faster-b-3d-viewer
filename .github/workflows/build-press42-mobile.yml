name: Optimize FASTER B press42 for mobile
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/optimize_press42.py
      - .github/workflows/build-press42-mobile.yml
permissions:
  contents: write
jobs:
  build-mobile-glb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install geometry optimizer dependency
        run: python -m pip install numpy
      - name: Rebuild verified mobile GLB without mesh decimation
        run: python scripts/optimize_press42.py
      - name: Verify gzip concatenation and mobile manifest
        shell: bash
        run: |
          python - <<'PY'
          import gzip,hashlib,json,pathlib,struct
          root=pathlib.Path('press42')
          manifest=json.loads((root/'mobile_build_status.json').read_text())
          packed=(root/'press42-mobile-1.gzpart').read_bytes()+(root/'press42-mobile-2.gzpart').read_bytes()
          data=gzip.decompress(packed)
          assert len(data)==manifest['optimized_glb_bytes']
          assert hashlib.sha256(data).hexdigest()==manifest['optimized_sha256']
          assert data[:4]==b'glTF' and struct.unpack_from('<I',data,8)[0]==len(data)
          assert manifest['optimized_primitives'] <= 150
          assert manifest['original_triangles']==manifest['optimized_triangles']
          assert manifest['original_vertices']==manifest['optimized_vertices']
          print('Validated mobile GLB:',len(data),'bytes /',manifest['optimized_primitives'],'primitives')
          PY
      - name: Publish mobile files to the GitHub Pages branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f press42/press42-mobile-1.gzpart press42/press42-mobile-2.gzpart press42/mobile_build_status.json
          if git diff --cached --quiet; then
            echo 'Generated optimized GLB is already up to date.'
          else
            git commit -m 'Publish geometry-batched mobile press42 asset'
            git push origin HEAD:main
          fi
