function openCatalog(){
 resumeRotateAfterCatalog=viewer.hasAttribute('auto-rotate');
 setRotation(false);
 overlay.hidden=false; document.body.classList.add('catalog-open');
 closeButton.focus({preventScroll:true});
}
function closeCatalog(){
 if(!modal.hidden)closeModal();
 overlay.hidden=true;document.body.classList.remove('catalog-open');
 if(resumeRotateAfterCatalog&&!document.hidden)setRotation(true);
 resumeRotateAfterCatalog=false;
 openButton.focus({preventScroll:true});
}
openButton.addEventListener('click',openCatalog);
closeButton.addEventListener('click',closeCatalog);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeCatalog()});
const photoCache=new Map();
function urlFor(part){return new URL(part.image,document.baseURI).href;}
function preloadPhoto(part){
 const url=urlFor(part);
 if(photoCache.has(url))return photoCache.get(url);
 const image=new Image();image.decoding='async';image.src=url;
 const ready=image.decode?image.decode().catch(()=>null):new Promise(resolve=>{image.onload=resolve;image.onerror=resolve});
 photoCache.set(url,ready);return ready;
}
function warmAllPhotos(){
 if('requestIdleCallback' in window){
   requestIdleCallback(()=>CATALOG.forEach(p=>preloadPhoto(p)),{timeout:1800});
 }else{CATALOG.forEach(p=>preloadPhoto(p))}
}
let photoRequestId=0;
function choosePart(part){
 selectedId=part.id;title.textContent=part.name;
 description.textContent=part.description;photo.alt='الصورة الأصلية: '+part.name;
 const requestId=++photoRequestId;
 const next=urlFor(part);
 photo.onerror=()=>{if(requestId===photoRequestId)description.textContent=part.description+' (تعذر تحميل صورة هذا الجزء، حاول تحديث الصفحة).'};
 // Update immediately; predecoded images from the cache render without an extra decode flash.
 photo.src=next;
 preloadPhoto(part);
 for(const b of partsList.children)b.setAttribute('aria-selected',String(b.dataset.id===part.id));
}
function renderCatalog(){
 const fragment=document.createDocumentFragment();
 for(const part of CATALOG){
  const btn=document.createElement('button');btn.type='button';btn.dataset.id=part.id;btn.setAttribute('aria-selected','false');btn.setAttribute('aria-label','عرض '+part.name);
  const img=document.createElement('img');img.src=urlFor(part);img.loading='lazy';img.decoding='async';img.alt='';
  const label=document.createElement('span');label.textContent=part.name;
  btn.append(img,label);
  btn.addEventListener('click',()=>choosePart(part));
  fragment.append(btn);
 }
 partsList.append(fragment);choosePart(CATALOG[0]);
}
function openModal(){
 if(!photo.complete||!photo.naturalWidth)return;
 modalTitle.textContent=title.textContent;modalPhoto.src=photo.src;modalPhoto.alt=photo.alt;modal.hidden=false;

}
function closeModal(){modal.hidden=true;modalPhoto.removeAttribute('src');photo.focus({preventScroll:true})}
photo.addEventListener('click',openModal);
photo.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal()}});
document.getElementById('modalClose').onclick=closeModal;
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

document.getElementById('back').onclick=()=>{if(!overlay.hidden)closeCatalog();else if(history.length>1)history.back();else if(window.opener)window.close()};
function updateRotateButton(){
 const enabled=viewer.hasAttribute('auto-rotate');
 rotateButton.setAttribute('aria-pressed',String(enabled));
 rotateButton.textContent=enabled?'Ⅱ':'↻';
 rotateButton.setAttribute('aria-label',enabled?'إيقاف الدوران التلقائي':'تشغيل الدوران التلقائي');
}
function setRotation(enabled){viewer.toggleAttribute('auto-rotate',!!enabled);updateRotateButton()}
rotateButton.addEventListener('click',()=>setRotation(!viewer.hasAttribute('auto-rotate')));
// Respect manual control: first touch/drag stops auto-rotation until play or reset.
viewer.addEventListener('pointerdown',()=>{if(viewer.hasAttribute('auto-rotate'))setRotation(false)});
function fitWholeMachine(){
 if(!modelReady)return;
 const d=viewer.getDimensions?.(),center=viewer.getBoundingBoxCenter?.();
 const w=stage.clientWidth,h=stage.clientHeight;
 if(!d||!center||w<80||h<80)return;
 const dx=Math.abs(d.x),dy=Math.abs(d.y),dz=Math.abs(d.z);
 const horizontalSpan=Math.hypot(dx,dz),polar=POLAR*Math.PI/180;
 const actualFov=(viewer.getFieldOfView?.()||FOV)*Math.PI/360;
 const vertTan=Math.tan(actualFov/2),horizTan=vertTan*w/h;
 if(!(vertTan>0&&horizTan>0))return;
 const halfWidth=horizontalSpan/2;
 const halfHeight=(Math.abs(Math.sin(polar))*dy+Math.abs(Math.cos(polar))*horizontalSpan)/2;
 const halfDepth=(Math.abs(Math.sin(polar))*horizontalSpan+Math.abs(Math.cos(polar))*dy)/2;
 const distance=(Math.max(halfWidth/horizTan,halfHeight/vertTan)+halfDepth)*PADDING;
 viewer.cameraTarget=`${center.x}m ${center.y}m ${center.z}m`;
 viewer.cameraOrbit=`${START_AZIMUTH}deg ${POLAR}deg ${distance.toFixed(3)}m`;
 viewer.jumpCameraToGoal?.();lastAspect=w/Math.max(1,h);
}
document.getElementById('reset').onclick=()=>{fitWholeMachine();setRotation(true)};
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){console.warn('ملء الشاشة غير متاح',e)}};
function fail(msg){loading.hidden=true;error.hidden=false;document.getElementById('errorText').textContent=msg||'تعذر فتح المجسم. حاول تحديث Chrome أو Edge.'}
// Measured download progress; processing and GPU preparation remain animated
// without showing a fabricated percentage or an inaccurate time estimate.
let downloadedBytes=0,lastDownloadPercent=-1;
const COMPRESSED_TOTAL_BYTES=13286921*2; // Published gzpart file lengths.
function updateDownloadProgress(){
 const pct=Math.min(100,Math.floor(downloadedBytes/COMPRESSED_TOTAL_BYTES*100));
 if(pct===lastDownloadPercent)return;
 lastDownloadPercent=pct;
 progress.style.width=pct+'%';
 loadPercent.textContent=pct+'%';
 loadTrack.setAttribute('aria-valuenow',String(pct));
}
function setLoadingStage(phase,message){
 loading.dataset.phase=phase;
 loadStep.textContent=message;
 if(phase==='download'){
  loadTrack.classList.remove('is-indeterminate');
  loadPercent.hidden=false;
  loadTrack.setAttribute('aria-valuenow',String(Math.max(0,lastDownloadPercent)));
 }else{
  loadTrack.classList.add('is-indeterminate');
  loadTrack.removeAttribute('aria-valuenow');
  loadPercent.hidden=true;
 }
}
viewer.addEventListener('load',()=>{
 modelReady=true;
 // Frame camera before enabling rotation and before revealing the first WebGL frame.
 setRotation(false);
 fitWholeMachine();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  loading.hidden=true;progress.style.width='100%';setRotation(true);
 }));
});
viewer.addEventListener('error',ev=>{console.error('3D viewer error',ev);fail('تعذّر قراءة المجسم ثلاثي الأبعاد. يُرجى تحديث Chrome وإعادة المحاولة.')});
// model-viewer adjusts its canvas to screen resize automatically. Don't override a user-controlled camera.
document.addEventListener('visibilitychange',()=>{if(document.hidden){wasAutoRotating=viewer.hasAttribute('auto-rotate');setRotation(false)}else if(wasAutoRotating){setRotation(true);wasAutoRotating=false}});
// Fetch two compressed pieces concurrently and decompress their ordered bytes
// as they arrive. This avoids holding a separate 26 MB download buffer in memory.
async function loadFflate(){
 if(window.fflate?.gunzipSync)return window.fflate;
 await new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src=new URL('./vendor/fflate-0.8.2.min.js',document.baseURI).href;
  script.onload=resolve;
  script.onerror=()=>reject(new Error('تعذّر تحميل مكوّن فك الضغط على هذا المتصفح.'));
  document.head.appendChild(script);
 });
 if(!window.fflate?.gunzipSync)throw new Error('مكوّن فك الضغط غير متاح. افتح الرابط في Chrome.');
 return window.fflate;
}
async function prepareModel(){
 const urls=['press42-mobile-1.gzpart','press42-mobile-2.gzpart'];
 setLoadingStage('download','جارٍ تنزيل بيانات العرض…');
 const responses=await Promise.all(urls.map(async name=>{
  const address=new URL(name,document.baseURI);
  let response;
  try{response=await fetch(address,{cache:'force-cache'});}
  catch(e){response=await fetch(address,{cache:'reload'});}
  if(!response.ok)throw Error('تعذّر تنزيل بيانات المكبس ('+response.status+').');
  return response;
 }));
 let result;
 if(typeof DecompressionStream==='function'&&typeof ReadableStream==='function'&&responses.every(r=>r.body?.getReader)){
  // A byte stream maintains the gzip order while fetches stay concurrent.
  const readers=responses.map(r=>r.body.getReader());
  let active=0;
  const orderedStream=new ReadableStream({
   async pull(controller){
    try{
     while(active<readers.length){
      const {done,value}=await readers[active].read();
      if(done){active++;continue;}
      downloadedBytes+=value.byteLength;
      updateDownloadProgress();
      controller.enqueue(value);
      return;
     }
     controller.close();
    }catch(error){controller.error(error);}
   },
   cancel(reason){for(const reader of readers)reader.cancel(reason).catch(()=>{});}
  });
  // Decompression overlaps the network download instead of waiting for 26.6 MB.
  result=await new Response(orderedStream.pipeThrough(new DecompressionStream('gzip'))).blob();
 }else{
  // Embedded browsers with no DecompressionStream get a local, same-origin fallback.
  const [packed,fflate]=await Promise.all([
   Promise.all(responses.map(async response=>{
    const bytes=new Uint8Array(await response.arrayBuffer());
    downloadedBytes+=bytes.byteLength;updateDownloadProgress();
    return bytes;
   })),
   loadFflate()
  ]);
  setLoadingStage('prepare','جارٍ تجهيز المجسم ثلاثي الأبعاد…');
  const compressed=new Uint8Array(packed.reduce((sum,chunk)=>sum+chunk.length,0));
  let offset=0;
  for(const chunk of packed){compressed.set(chunk,offset);offset+=chunk.length;}
  result=new Blob([fflate.gunzipSync(compressed)],{type:'model/gltf-binary'});
 }
 updateDownloadProgress();
 setLoadingStage('prepare','جارٍ تجهيز المجسم ثلاثي الأبعاد…');
 if(result.size!==59795428)throw Error('بيانات المجسم غير مكتملة أو تالفة. يُرجى إعادة تحميل الصفحة.');
 const signature=new Uint8Array(await result.slice(0,4).arrayBuffer());
 if(signature[0]!==103||signature[1]!==108||signature[2]!==84||signature[3]!==70)throw Error('صيغة GLB غير صالحة.');
 return URL.createObjectURL(result);
}
async function boot(){
 try{
  if(location.protocol==='file:')throw Error('افتح العارض من رابط HTTPS المنشور.');
  const [url]=await Promise.all([
   prepareModel(),
   (async()=>{
    // Host the pinned viewer locally: embedded browsers may block public CDNs.
    await import('./vendor/model-viewer-4.3.1.min.js');
    await customElements.whenDefined('model-viewer');
   })()
  ]);
  customElements.get('model-viewer').minimumRenderScale=.35;
  updateRotateButton();
  setLoadingStage('display','جارٍ فتح العارض ثلاثي الأبعاد…');
  viewer.src=url;
 }catch(e){console.error(e);fail(e?.message)}
}
renderCatalog();
boot();
