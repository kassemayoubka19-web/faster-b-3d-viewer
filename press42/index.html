<style>

.toolbar button:hover{background:#f1f3f2}
.toolbar button[aria-pressed="true"]{color:#9e7a34;background:#faf6ee}
.toolbar svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:21px;height:21px}
.parts-panel{min-width:0;min-height:0;direction:rtl;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:13;overflow:hidden}
.parts-top{flex:0 0 auto;min-height:51px;display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line)}
.parts-title{flex:1;white-space:nowrap;font-size:13px;font-weight:800}
.parts-toggle{flex:0 0 auto;min-height:32px;min-width:32px;padding:4px 8px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:12px;color:#344047}

.parts-list{flex:0 1 auto;min-height:68px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:6px 7px;display:flex;flex-direction:column;gap:4px}

.workspace.panel-closed .parts-top{padding:7px 5px;flex-direction:column}

 .parts-panel:not(.is-open){width:79px;max-height:44px}

@media(min-width:701px) and (max-height:620px){.part-details{flex-basis:31%}.detail-photo{max-height:21vh}.parts-list{flex:1 1 auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const START_AZIMUTH=-36, POLAR=74, FOV=38, PADDING=1.065;
let modelReady=false,lastAspect=0,selectedId='',wasAutoRotating=false;
const PARTS=[
  {id:"upperSurface",name:"سطح الكوي العلوي – 42 بوصة",tile:9,position:"-0.19800m 1.40800m 0.24300m",normal:"0 -0.65 0.76",description:"أسطح كوي مزودة بثقوب موزعة على السطحين العلوي والسفلي، مع فلاتر داخلية تساعد على توزيع البخار ومروره بانتظام، مما يضمن كويًا متجانسًا، وإزالة التجاعيد بكفاءة، والحصول على نتائج احترافية مع الحفاظ على جودة الأقمشة.",image:"./photos/pressing_surfaces.webp?v=20261018r2"},
  {id:"lowerSurface",name:"سطح الكوي السفلي – 42 بوصة",tile:9,position:"-0.19800m 1.15400m 0.25500m",normal:"0 0.97 0.24",description:"أسطح كوي مزودة بثقوب موزعة على السطحين العلوي والسفلي، مع فلاتر داخلية تساعد على توزيع البخار ومروره بانتظام، مما يضمن كويًا متجانسًا، وإزالة التجاعيد بكفاءة، والحصول على نتائج احترافية مع الحفاظ على جودة الأقمشة.",image:"./photos/pressing_surfaces.webp?v=20261018r2"},
  {id:"controlPanel",name:"لوحة التحكم الكهربائية (Control Panel)",tile:6,position:"0.47500m 0.45000m 0.40200m",normal:"0 0 1",description:"تتيح التحكم بتشغيل وإيقاف الأنظمة الرئيسية لمكبس الكوي، ومراقبة حالة التشغيل عبر المؤشرات الضوئية، بالإضافة إلى زر إيقاف الطوارئ لقطع التشغيل سريعًا عند الحاجة، مما يضمن سهولة التحكم وسلامة الاستخدام.",image:"./photos/control_panel.webp?v=20261018r2"},
  {id:"footPedals",name:"مجموعة دواسات التحكم (Foot Control Pedals)",tile:8,position:"-0.17200m 0.14000m 0.70800m",normal:"0 0.1 0.995",description:"تتيح التحكم بوظائف مكبس الكوي باستخدام القدم، مما يسهّل التشغيل ويترك يدي المستخدم حرتين لترتيب الملابس أثناء الكوي.",image:"./photos/foot_pedals.webp?v=20261018r2"},
  {id:"pressureGauge",name:"ساعة قياس ضغط البخار (Pressure Gauge)",tile:3,position:"0.19200m 1.48800m -0.16500m",normal:"0 0 1",description:"تعمل على قياس وعرض ضغط البخار داخل مكبس الكوي بشكل مباشر، مما يساعد على مراقبة مستوى الضغط والتأكد من بقائه ضمن الحدود الآمنة لضمان كفاءة التشغيل وسلامة المعدة.",image:"./photos/pressure_gauge.webp?v=20261018r2"},
  {id:"pressureControl",name:"مفتاح التحكم بضغط البخار (Honeywell Pressuretrol)",tile:5,position:"0.38500m 1.50000m -0.15800m",normal:"0 0 1",description:"يعمل على مراقبة ضغط البخار داخل مكبس الكوي والتحكم بتشغيل وإيقاف التسخين تلقائيًا وفق حدود الضغط المحددة، مما يساعد على استقرار الضغط وضمان التشغيل الآمن والفعّال للمعدة.",image:"./photos/pressuretrol.webp?v=20261018r2"},
  {id:"safetyValve",name:"صمام الأمان",tile:0,position:"0.38700m 0.94800m -0.32600m",normal:"0.98 0 -0.2",description:"حماية مكبس الكوي من ارتفاع ضغط البخار عن الحد المسموح، حيث يقوم بتنفيس الضغط الزائد تلقائيًا للحفاظ على سلامة المعدة والمستخدم.",image:"./photos/safety_valve.webp?v=20261018r2"},
  {id:"steamTrap",name:"مصيدة البخار (Steam Trap)",tile:2,position:"-0.69100m 0.65300m -0.01100m",normal:"-1 0 0",description:"تعمل على تصريف المياه المتكثفة تلقائيًا من نظام البخار في مكبس الكوي، مع الحد من فقدان البخار، مما يساهم في الحفاظ على كفاءة التسخين واستقرار أداء المكبس.",image:"./photos/steam_trap.webp?v=20261018r2"},
  {id:"suctionBlower",name:"مضخة شفط الهواء (Vacuum Blower)",tile:4,position:"-0.56000m 0.24300m -0.51100m",normal:"0 0 -1",description:"تعمل على سحب الهواء والبخار والرطوبة من سطح الكوي، مما يساعد على تثبيت الملابس أثناء الكوي وتسريع تجفيفها للحصول على نتائج كوي احترافية.",image:"./photos/vacuum_blower.webp?v=20261018r2"},
  {id:"waterLevel",name:"مؤشر مستوى المياه (Water Level Gauge)",tile:7,position:"0.70500m 0.46600m -0.12800m",normal:"1 0 0",description:"يُستخدم لمراقبة مستوى المياه داخل الخزان الداخلي لمكبس الكوي بشكل مباشر، مما يساعد على التأكد من توفر الكمية المناسبة من المياه لإنتاج البخار، وتجنب انخفاض مستواها أثناء التشغيل.",image:"./photos/water_level_gauge.webp?v=20261018r2"},

];
const CATALOG=[
  PARTS.find(p=>p.id==='upperSurface'),
  ...['footPedals','waterLevel','controlPanel','pressureControl','pressureGauge','suctionBlower','steamTrap','waterPump','safetyValve','drainAndCable'].map(id=>PARTS.find(p=>p.id===id)),
  {id:'heater',name:'سخانات مكبس الكوي 18 كيلو واط عدد 3',description:'سخانات مكبس الكوي الكهربائية بقدرة إجمالية 18 كيلو واط، عدد 3 سخانات.',image:'./photos/heater_left.webp?v=20261018r2'}

if(CATALOG.some(x=>!x))throw new Error('بيانات جزء معتمد غير موجودة.');
const mobile=matchMedia('(max-width:700px)');
function setPanel(open){
  const m=mobile.matches;
  panel.classList.toggle('is-open',open);
  workspace.classList.toggle('panel-closed',!m&&!open);
  toggle.textContent=open?'›':'‹';
  toggle.setAttribute('aria-expanded',String(open));
  toggle.setAttribute('aria-label',open?'إخفاء قائمة الأجزاء':'عرض قائمة الأجزاء');
  requestAnimationFrame(()=>{if(modelReady&&!m)fitWholeMachine()});
}
function initPanel(){setPanel(!mobile.matches)}
toggle.addEventListener('click',()=>setPanel(!panel.classList.contains('is-open')));
mobile.addEventListener?.('change',initPanel);
function selectPart(part){
  selectedId=part.id;
  title.textContent=part.name;
  description.textContent=part.description;
  photo.alt='صورة أصلية: '+part.name;
  photo.onerror=()=>{description.textContent=part.description+' — تعذّر تحميل صورة هذا الجزء.';};
  photo.src=new URL(part.image,document.baseURI).href;
  for(const b of list.children)b.setAttribute('aria-selected',String(b.dataset.id===part.id));
  if(mobile.matches&&!panel.classList.contains('is-open'))setPanel(true);
}
function renderCatalog(){
  const fragment=document.createDocumentFragment();
  for(const part of CATALOG){
    const b=document.createElement('button');
    b.type='button';b.className='part-row';b.dataset.id=part.id;
    b.setAttribute('aria-selected','false');b.setAttribute('aria-label','عرض '+part.name);
    const img=document.createElement('img');
    img.src=new URL(part.image,document.baseURI).href;
    img.alt='';img.loading='lazy';img.decoding='async';
    const name=document.createElement('span');name.textContent=part.name;
    const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='‹';arrow.setAttribute('aria-hidden','true');
    b.append(img,name,arrow);
    b.addEventListener('click',()=>selectPart(part));
    fragment.appendChild(b);
  }
  list.appendChild(fragment);
  selectPart(CATALOG[0]);
}
function updateRotateButton(){
 const enabled=viewer.hasAttribute('auto-rotate');
 rotateButton.setAttribute('aria-pressed',String(enabled));
 rotateButton.textContent=enabled?'Ⅱ':'↻';
 rotateButton.setAttribute('aria-label',enabled?'إيقاف الدوران التلقائي':'تشغيل الدوران التلقائي');
}
function setRotation(enabled){viewer.toggleAttribute('auto-rotate',!!enabled);updateRotateButton()}
rotateButton.addEventListener('click',()=>setRotation(!viewer.hasAttribute('auto-rotate')));
function fitWholeMachine(){
 if(!modelReady)return;
 const d=viewer.getDimensions?.(),center=viewer.getBoundingBoxCenter?.();
 const w=stage.clientWidth,h=stage.clientHeight;
 if(!d||!center||w<80||h<80)return;
 const dx=Math.abs(d.x),dy=Math.abs(d.y),dz=Math.abs(d.z);
 const horizontalSpan=Math.hypot(dx,dz),polar=POLAR*Math.PI/180;
 const actualFov=(viewer.getFieldOfView?.()||FOV)*Math.PI/360;
 const vertTan=Math.tan(actualFov),horizTan=vertTan*w/h;
 if(!(vertTan>0&&horizTan>0))return;
 const halfWidth=horizontalSpan/2;
 const halfHeight=(Math.abs(Math.sin(polar))*dy+Math.abs(Math.cos(polar))*horizontalSpan)/2;
 const halfDepth=(Math.abs(Math.sin(polar))*horizontalSpan+Math.abs(Math.cos(polar))*dy)/2;
 const distance=(Math.max(halfWidth/horizTan,halfHeight/vertTan)+halfDepth)*PADDING;
 viewer.cameraTarget=`${center.x}m ${center.y}m ${center.z}m`;
 viewer.cameraOrbit=`${START_AZIMUTH}deg ${POLAR}deg ${distance.toFixed(3)}m`;
 viewer.jumpCameraToGoal?.();
 lastAspect=w/Math.max(1,h);
}
document.getElementById('back').onclick=()=>{if(history.length>1)history.back();else if(window.opener)window.close();};
document.getElementById('reset').onclick=()=>{fitWholeMachine();setRotation(true)};
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){console.warn('ملء الشاشة غير متاح',e)}};
function closeModal(){modal.hidden=true;modalPhoto.removeAttribute('src')}
function openModal(){
 if(!photo.complete||!photo.naturalWidth)return;
 modalTitle.textContent=title.textContent;modalPhoto.src=photo.src;modalPhoto.alt=photo.alt;modal.hidden=false;
 document.getElementById('modalClose').focus({preventScroll:true});
}
photo.tabIndex=0;photo.setAttribute('role','button');photo.setAttribute('aria-label','تكبير صورة الجزء');
photo.addEventListener('click',openModal);
photo.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal()}});
document.getElementById('modalClose').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!modal.hidden)closeModal();else if(mobile.matches&&panel.classList.contains('is-open'))setPanel(false)}});
function fail(msg){loading.hidden=true;error.hidden=false;document.getElementById('errorText').textContent=msg||'تعذر فتح المجسم. جرب Chrome أو Edge.'}
viewer.addEventListener('progress',ev=>{progress.style.width=Math.max(5,Math.round((ev.detail?.totalProgress||0)*100))+'%'});
viewer.addEventListener('load',()=>{
 modelReady=true;requestAnimationFrame(()=>{fitWholeMachine();loading.hidden=true;progress.style.width='100%';setRotation(true)});
});
viewer.addEventListener('error',ev=>{console.error('3D viewer error',ev);fail('تعذّر قراءة المجسم ثلاثي الأبعاد. يُرجى تحديث Chrome وإعادة المحاولة.')});
new ResizeObserver(()=>{if(!modelReady)return;const asp=stage.clientWidth/Math.max(1,stage.clientHeight);if(Math.abs(asp-lastAspect)>.08)requestAnimationFrame(fitWholeMachine)}).observe(stage);
document.addEventListener('visibilitychange',()=>{if(document.hidden){wasAutoRotating=viewer.hasAttribute('auto-rotate');setRotation(false)}else if(wasAutoRotating){setRotation(true);wasAutoRotating=false}});
async function prepareModel(){
 if(!('DecompressionStream' in window))throw Error('المتصفح لا يدعم فك ضغط المجسم. حدّث Chrome أو Edge.');
 const urls=['press42-mobile-1.gzpart','press42-mobile-2.gzpart'];
 loadLabel.textContent='جارِ تنزيل ملفات المجسم المحسّن…';
 const compressedParts=await Promise.all(urls.map(async file=>{
  const response=await fetch(new URL(file,document.baseURI),{cache:'force-cache'});
  if(!response.ok)throw Error('فشل تحميل '+file+' (HTTP '+response.status+')');
  return response.blob();
 }));
 progress.style.width='35%';loadLabel.textContent='جارِ فك ضغط المجسم وتجهيزه…';
 const stream=new Blob(compressedParts,{type:'application/gzip'}).stream();
 const result=await new Response(stream.pipeThrough(new DecompressionStream('gzip'))).blob();
 if(result.size!==59795428)throw Error('بيانات المجسم غير مكتملة أو تالفة.');
 const signature=new Uint8Array(await result.slice(0,4).arrayBuffer());
 if(signature[0]!==103||signature[1]!==108||signature[2]!==84||signature[3]!==70)throw Error('صيغة GLB غير صالحة.');
 progress.style.width='60%';
 return URL.createObjectURL(new Blob([result],{type:'model/gltf-binary'}));
}
async function boot(){
 try{
  if(location.protocol==='file:')throw Error('افتح العارض من رابط HTTPS المنشور.');
  const [url]=await Promise.all([
   prepareModel(),
   (async()=>{
    await import('https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js').catch(()=>import('https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js'));
    await customElements.whenDefined('model-viewer');
   })()
  ]);
  customElements.get('model-viewer').minimumRenderScale=.35;
  updateRotateButton();
  loadLabel.textContent='جارِ عرض مجسم المكبس…';
  viewer.src=url;
 }catch(e){console.error(e);fail(e?.message)}
}
renderCatalog();
initPanel();
boot();
</script>
</body>
</html>
